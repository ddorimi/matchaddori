<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchaddori - Music</title>
    <link rel="stylesheet" href="styles.css">
    <link rel = "icon" type= "image/png" href="assets/matcha logo.png">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
        <img src="assets/md logo.png" alt="Matchaddori logo">
    </div>

    <div class="container">
        <div class="sidebar">
            <button onclick="navigateTo('home.html')">HOME</button>
            <button onclick="navigateTo('menu.html')">MENU</button>
            <button class="active">MUSIC</button>
            <button onclick="navigateTo('jobs.html')">JOBS</button>
        </div>

        <div class="music-section">
            <div class="music-frame">
                <!-- Screen (Custom Song Display) -->
                <div class="screen">
                    <div class="image-info-container">
                        <img src="assets/Rectangle 81.png" alt="Feel My Rhythm" class="album-art">
                        <div class="song-info">
                            <p class="song-title">Feel My Rhythm</p>
                            <p class="artist">Red Velvet</p>
                        </div>
                    </div>
                    <audio id="audio-player" src="assets/Feel My Rhythm.mp3"></audio>
                    <div class="progress-container">
                        <input type="range" min="0" max="235" value="130" class="progress-bar">
                        <div class="time-container">
                            <span class="current-time">0:00</span>
                            <span class="duration-time">3:30</span>
                        </div>
                    </div>
                </div>
                
                <!-- iPod Circular Controls -->
                <div class="ipod-controls">
                    <div class="circle">
                        <div class="inner-circle"></div>
                        <span class="menu">MENU</span>
                        <button class="control-btn prev"><img src="assets/bk.png" class="back"></button>
                        <button class="control-btn play"><img src="assets/play.png" class="play"></button>
                        <button class="control-btn next"><img src="assets/fr.png" class="forward"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Copyright &copy; 2025 Matchaddori | <b>ddorimi13@gmail.com</b></p>
    </div>
</body>
</html>
